<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Vista — Spot the Difference</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <h1>TWIN&nbsp;VISTA</h1>
      <p>spot the difference</p>
    </div>
    <nav class="scenes" id="sceneTabs" aria-label="Scenes">
      <button data-scene="0" class="tab active">I · Harbour Dawn <span>8 differences</span></button>
      <button data-scene="1" class="tab">II · Market Square <span>10 differences</span></button>
      <button data-scene="2" class="tab">III · Coral Reef <span>12 differences</span></button>
    </nav>
  </header>

  <section class="statbar">
    <div class="stat counter">
      <label>Differences found</label>
      <strong id="counter">0 / 8</strong>
      <span id="togo" class="togo">8 to go</span>
    </div>
    <div class="stat timer">
      <label>Time left</label>
      <div class="bar"><div id="timebar"></div></div>
      <strong id="clock">4:00</strong>
    </div>
    <div class="stat">
      <label>Score</label>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <label>Mistakes</label>
      <strong id="mistakes">0</strong>
    </div>
    <div class="controls">
      <button id="hintBtn" class="btn hint">Hint · <span id="hintsLeft">3</span> left</button>
      <button id="restartBtn" class="btn">Restart</button>
      <button id="soundBtn" class="btn">Sound: on</button>
    </div>
  </section>

  <main class="stage">
    <canvas id="game" width="1252" height="472"></canvas>
    <div id="overlay" class="overlay" hidden>
      <div class="card">
        <h2 id="overlayTitle">Scene clear!</h2>
        <div id="overlayStars" class="stars">★★★</div>
        <p id="overlayText"></p>
        <div class="cardButtons">
          <button id="overlayNext" class="btn primary">Next scene</button>
          <button id="overlayRetry" class="btn">Play again</button>
        </div>
      </div>
    </div>
  </main>

  <section class="foundbar">
    <span class="foundLabel">Found:</span>
    <div id="chips" class="chips"><span class="none">nothing yet — click a difference in either picture</span></div>
    <span class="tip">Keys: H hint · R restart · M sound · 1–3 scenes</span>
  </section>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
